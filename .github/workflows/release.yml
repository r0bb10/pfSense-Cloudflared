name: Track Upstream and Release

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Official cloudflared tag to build, defaults to latest release
        required: false
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: upstream-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Resolve upstream release
        id: resolve
        uses: actions/github-script@v8
        env:
          TAG_INPUT: ${{ inputs.tag }}
        with:
          script: |
            const tagInput = (process.env.TAG_INPUT || '').trim();
            let tagName = tagInput;
            if (!tagName) {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: 'cloudflare',
                repo: 'cloudflared'
              });
              tagName = data.tag_name;
            }
            const version = tagName.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error('Invalid upstream Cloudflared version');
            }
            core.setOutput('tag', tagName);
            core.setOutput('version', version);
            core.setOutput('release_tag', version);
      - name: Check existing package release
        id: check
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.resolve.outputs.tag }}
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG
              });
              const body = data.body || '';
              const upstreamTag = process.env.UPSTREAM_TAG;
              const matches = !data.draft && !data.prerelease &&
                (body.includes('Upstream cloudflared: `' + upstreamTag + '`') ||
                  body.includes('official cloudflared `' + upstreamTag + '`'));
              core.setOutput('exists', matches ? 'true' : 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }

  build:
    if: needs.prepare.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build cloudflared and package on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.4.8
        env:
          PORTVERSION: ${{ needs.prepare.outputs.version }}
        with:
          release: '15.0'
          usesh: true
          mem: 4096
          envs: PORTVERSION
          prepare: |
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f
            pkg update -f
            pkg install -f -y git gmake go ca_root_nss
          run: |
            chmod +x build.sh scripts/build-cloudflared-freebsd.sh
            ./scripts/build-cloudflared-freebsd.sh '${{ needs.prepare.outputs.tag }}'
            ./build.sh package
            cp build/pkg/*.pkg ./pfSense-pkg-cloudflared-${{ needs.prepare.outputs.version }}.pkg
      - name: Attest package
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: pfSense-pkg-cloudflared-${{ needs.prepare.outputs.version }}.pkg
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pfSense-pkg-cloudflared-${{ needs.prepare.outputs.version }}
          path: pfSense-pkg-cloudflared-${{ needs.prepare.outputs.version }}.pkg
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.version }}
          body: |
            pfSense package for official cloudflared `${{ needs.prepare.outputs.tag }}` built for FreeBSD 15 amd64 with BSD compatibility patches from `kjake/cloudflared`.
            Package version: `${{ needs.prepare.outputs.version }}`.
            Upstream cloudflared: `${{ needs.prepare.outputs.tag }}`.
          overwrite_files: true
          files: pfSense-pkg-cloudflared-${{ needs.prepare.outputs.version }}.pkg

  cleanup:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Retain one previous run
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              status: 'completed',
              per_page: 100
            });
            const previousRuns = runs
              .filter((run) => run.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const run of previousRuns.slice(1)) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
